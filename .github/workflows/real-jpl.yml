name: Real JPL DE421 integration

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/real-jpl.yml'
      - 'tests/test_real_jpl_integration.py'
      - 'jpl_kernel_audit.py'
      - 'western_chart.py'

permissions:
  contents: read

jobs:
  real-jpl:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install astronomy test dependencies
        run: python -m pip install 'skyfield>=1.50,<2'
      - name: Retrieve authentic JPL DE421 ephemeris into temporary CI workspace
        env:
          JPL_URL: https://ssd.jpl.nasa.gov/ftp/eph/planets/bsp/de421.bsp
        run: |
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 20 \
            --max-time 240 "$JPL_URL" --output "$RUNNER_TEMP/de421.bsp"
          test "$(stat -c%s "$RUNNER_TEMP/de421.bsp")" -gt 10000000
      - name: Run real kernel integration and out-of-range regression
        env:
          JPL_EPHEMERIS_PATH: ${{ runner.temp }}/de421.bsp
        run: python -m unittest discover -s tests -p 'test_real_jpl_integration.py' -v
      - name: Remove temporary ephemeris
        if: always()
        run: rm -f "$RUNNER_TEMP/de421.bsp"
